{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Create Problem</h1>
        <p class="mt-1 text-sm text-gray-600">Share a clear problem so others can solve it quickly.</p>
    </div>

    <div class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm">
        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <div>
                <label for="title" class="mb-1 block text-sm font-semibold text-gray-700">Title</label>
                <input
                    id="title"
                    type="text"
                    name="title"
                    placeholder="Enter problem title"
                    required
                    class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
                >
            </div>

            <div>
                <label for="description" class="mb-1 block text-sm font-semibold text-gray-700">Description</label>
                <textarea
                    id="description"
                    name="description"
                    rows="6"
                    placeholder="Describe the problem with required details..."
                    required
                    class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
                ></textarea>
            </div>

            <div>
                <label for="tags" class="mb-1 block text-sm font-semibold text-gray-700">Tags</label>
                <input
                    id="tags"
                    type="text"
                    name="tags"
                    placeholder="e.g. python, django, api"
                    class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
                >
                <p class="mt-1 text-xs text-gray-500">Use comma-separated tags (max 5).</p>
            </div>

            <div>
                <label for="difficulty" class="mb-1 block text-sm font-semibold text-gray-700">Difficulty</label>
                <select
                    id="difficulty"
                    name="difficulty"
                    required
                    class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
                >
                    <option value="">Select Difficulty</option>
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>

            <div class="pt-2">
                <button
                    type="submit"
                    class="rounded-lg bg-gray-700 px-5 py-2.5 text-sm font-semibold text-white hover:bg-gray-800"
                >
                    Create Problem
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
