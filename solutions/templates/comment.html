<div style="margin-left: {{ level }}px;" class="mt-3 border-l-2 border-gray-200 pl-3">
    <p class="text-sm leading-6 text-gray-800">
        <a href="{% url 'accounts:profile' comment.user.username %}" class="font-semibold text-blue-600 hover:underline">
            {{ comment.user.username }}
        </a>
        <span class="ml-2 text-xs text-gray-500">{{ comment.created_at|timesince }} ago</span><br>
        {{ comment.text }}
    </p>

    {% if user.is_authenticated %}
        <button
            type="button"
            onclick="toggleReply({{ comment.id }})"
            class="mt-2 rounded-md border border-gray-300 px-2.5 py-1 text-xs font-medium text-gray-700 hover:bg-gray-100"
        >
            Reply
        </button>
    {% endif %}

    <div id="reply-box-{{ comment.id }}" class="hidden mt-2">
        <form method="POST" action="{% url 'add_comment' comment.solution.id %}" class="flex flex-wrap gap-2">
            {% csrf_token %}
            <input type="hidden" name="parent_id" value="{{ comment.id }}">
            <input
                type="text"
                name="text"
                placeholder="Write a reply..."
                required
                class="min-w-[220px] flex-1 rounded-lg border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
            >
            <button type="submit" class="rounded-lg bg-blue-600 px-3 py-2 text-sm font-medium text-white hover:bg-blue-700">Send</button>
            <button type="button" onclick="cancelReply({{ comment.id }})" class="rounded-lg border border-gray-300 px-3 py-2 text-sm hover:bg-gray-100">Cancel</button>
        </form>
    </div>

    {% for reply in comment.replies.all %}
        {% include "comment.html" with comment=reply level=level|add:20 %}
    {% endfor %}
</div>
