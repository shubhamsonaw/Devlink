{% extends "base.html" %}

{% block content %}

<div class="max-w-md mx-auto mt-16 bg-white p-6 rounded shadow">

    <h2 class="text-xl font-semibold mb-4 text-center">
        Login
    </h2>

    <!-- ERROR -->
    {% if form.errors %}
        <p class="text-red-500 text-sm mb-3 text-center">
            Invalid username or password
        </p>
    {% endif %}

    <!-- DJANGO MESSAGES -->
    {% for message in messages %}
        <p class="text-red-500 text-sm mb-2 text-center">
            {{ message }}
        </p>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}

        <!-- VERY IMPORTANT FOR REDIRECT -->
        <input type="hidden" name="next" value="{{ request.GET.next }}">

        <div class="mb-3">
            <label class="block text-sm mb-1">Username or Email</label>
            <input type="text" name="username"
                class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
                required>
        </div>

        <div class="mb-4">
            <label class="block text-sm mb-1">Password</label>
            <input type="password" name="password"
                class="w-full border p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
                required>
        </div>

        <button type="submit"
            class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">
            Login
        </button>

    </form>

    <!-- EXTRA UX -->
  <div class="text-center mt-4 text-sm text-gray-500">
        Don’t have an account?
        <a href="{% url 'accounts:signup' %}" class="text-blue-600 hover:underline">
            Register
        </a>
    </div>

</div> 

{% endblock %}
