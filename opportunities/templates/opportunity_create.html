{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Create Opportunity</h1>
        <p class="mt-1 text-sm text-gray-600">Post a collaboration or hiring opportunity for the community.</p>
    </div>

    <div class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm">
        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <div>
                <label for="title" class="mb-1 block text-sm font-semibold text-gray-700">Title</label>
                <input
                    id="title"
                    type="text"
                    name="title"
                    required
                    placeholder="Enter opportunity title"
                    class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
                >
            </div>

            <div>
                <label for="description" class="mb-1 block text-sm font-semibold text-gray-700">Description</label>
                <textarea
                    id="description"
                    name="description"
                    rows="6"
                    required
                    placeholder="Describe scope, expectations, and timeline..."
                    class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
                ></textarea>
            </div>

            <div>
                <label for="required_skills" class="mb-1 block text-sm font-semibold text-gray-700">Required Skills</label>
                <input
                    id="required_skills"
                    type="text"
                    name="required_skills"
                    required
                    placeholder="e.g. Django, REST API, React"
                    class="w-full rounded-lg border border-gray-300 px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"
                >
            </div>

            <div class="pt-2 flex items-center gap-3">
                <button
                    type="submit"
                    class="rounded-lg bg-gray-700 px-5 py-2.5 text-sm font-semibold text-white hover:bg-gray-800"
                >
                    Create Opportunity
                </button>
                <a href="{% url 'opportunity_list' %}" class="text-sm text-gray-600 hover:text-gray-900 hover:underline">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
